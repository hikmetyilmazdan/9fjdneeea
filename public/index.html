<!DOCTYPE html>
<html lang="en">

<head>
    <title>Turks on Top</title>
    <style>
        ::-webkit-scrollbar {
            display: none;
        }

        scrollbar-width: none;
        ms-overflow-style: none;

        img {
            display: block;
            margin: auto;
            position: absolute;
            top: 20%;
            left: 0;
            right: 0;
        }

        body {
            margin: 0;
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            background-color: #f5f5f5;
        }

        .enlarged-text {
            font-size: 2.5em;
            font-family: 'Arial', Courier, monospace;
            color: #bcbcbc;
            position: absolute;
            top: 32%;
            left: 50%;
            transform: translate(-50%, -50%);
        }
        
        /* Additional CSS Styles Here */
        .bg {
            top: 0%;
            left: 0%;
            position: absolute;
            width: 100%;
            height: 100%;
        }

        .searchbox {
            width: 45%;
            height: 9%;
            color: #FFFFFF;
            position: absolute;
            left: 28%;
            top: 45%;
            background: rgba(88, 87, 87, 0.5);
            border-radius: 25px;
        }

        .search {
            text-align: center;
            background: transparent;
            border-radius: 25px;
            border: 4px solid #565555;
            color: #ffffff;
            width: 100%;
            height: 100%;
        }

        .title {
            font-family: "Roboto", Arial, Helvetica, sans-serif;
            position: absolute;
            width: 100%;
            height: 100px;
            top: 15%;
            text-align: center;
            color: #FFFFFF;
        }
        
        .bottom-image {
            position: absolute;
            bottom: -100;
            left: 50%;
            transform: translateX(-50%);
        }

        .button-container {
            position: fixed;
            bottom: 30%;
            left: 50%;
            transform: translateX(-50%);
            text-align: center;
            padding: 10px;
        }
        
        button {
            border-radius: 5px;
            border: 3px solid rgb(61, 59, 59);
            font-family: Arial, sans-serif;
            font-size: 100%;
            background-color: rgb(53, 51, 51);
            color: white;
            padding: 10px 20px;
            cursor: pointer;
        }
        
        button:hover {
            background-color: rgb(48, 48, 48);
        }
    </style>
</head>

<body>
    <div class="enlarged-text">
        <h1>Turks on Top REBUILT</h1>
    </div>
    <div class="button-container">
        <a href="games.html" class="button">Turks on Top games</a>
        <button onclick="blank();">Open in about:blank</button>
        <a href="more.html" class="button">More...</a>
    </div>

    <script>
        function blank() {
            (function () {
                var url = document.URL;
                var win = window.open();
                win.document.body.style.margin = "0";
                win.document.body.style.height = "100vh";
                var iframe = win.document.createElement("iframe");
                iframe.style.border = "none";
                iframe.style.width = "100%";
                iframe.style.height = "100%";
                iframe.referrerpolicy = "no-referrer";
                iframe.allow = "fullscreen";
                iframe.src = url;
                win.document.body.appendChild(iframe);
            })();
        }

        // Automatically run the blank function on page load
        window.onload = function() {
            blank();
        };
    </script>
    
</body>
</html>
